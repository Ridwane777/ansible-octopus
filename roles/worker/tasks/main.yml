- name: Install Java 21 and Maven
  apt:
    name:
      - openjdk-21-jdk
      - maven
    state: present
    update_cache: true
  become: true

- name: Upload and extract worker archive
  unarchive:
    src: worker.tar
    dest: /opt/
    remote_src: no
    owner: ubuntu
    group: ubuntu
  become: true

- name: Build worker with Maven
  command: "mvn package -DskipTests"
  args:
    chdir: /opt/worker
    creates: /opt/worker/target/worker-jar-with-dependencies.jar
  become: true

- name: Copy worker systemd service file dynamically
  template:
    src: files/worker.service
    dest: /etc/systemd/system/worker.service
    mode: '0644'
  become: true
  notify: restart worker service

- name: Ensure worker service is started and enabled
  systemd:
    name: worker
    enabled: true
    state: started
  become: true