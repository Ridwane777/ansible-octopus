- name: Install curl and prerequisites
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
  become: true

- name: Autoremove old unused dependencies
  apt:
    autoremove: yes
  become: true

- name: Add NodeSource GPG apt key
  get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /usr/share/keyrings/nodesource.asc
    mode: '0644'
    timeout: 30
  become: true
  register: download_key
  until: download_key is success
  retries: 3
  delay: 5

- name: Add NodeSource Node.js 20 repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nodesource.asc] https://deb.nodesource.com/node_20.x nodistro main"
    state: present
    filename: nodesource
  become: true

- name: Install Node.js from NodeSource
  apt:
    name: nodejs
    state: present
    update_cache: true
  become: true

- name: Create application directory for result
  file:
    path: /opt/result
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  become: true

- name: Extract result archive safely using playbook root path
  unarchive:
    src: result.tar
    dest: /opt/
    remote_src: no
    owner: root
    group: root
    creates: /opt/result/server.js
  become: true

- name: Install Node.js dependencies using npm module
  npm:
    path: /opt/result
    state: present
  become: true

- name: Copy result systemd service file dynamically
  template:
    src: files/result.service
    dest: /etc/systemd/system/result.service
    mode: '0644'
  become: true
  notify: restart result service

- name: Ensure result service is started and enabled
  systemd:
    name: result
    enabled: true
    state: started
  become: true