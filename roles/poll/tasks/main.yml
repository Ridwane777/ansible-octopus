- name: Install Python, gunicorn and system dependencies
  apt:
    name:
      - python3
      - python3-pip
      - python3-flask
      - python3-redis
      - gunicorn
    state: present
    update_cache: true
  become: true

- name: Extract poll archive safely using playbook root path
  unarchive:
    src: poll.tar
    dest: /opt/
    remote_src: no
    owner: root
    group: root
    creates: /opt/poll/app.py
  become: true

- name: Install Python dependencies from requirements.txt
  pip:
    requirements: /opt/poll/requirements.txt
    executable: pip3
    extra_args: "--break-system-packages"
  become: true

- name: Copy poll systemd service file dynamically
  template:
    src: files/poll.service
    dest: /etc/systemd/system/poll.service
    mode: '0644'
  become: true
  register: poll_service_updated

- name: Ensure poll service is started and enabled
  systemd:
    name: poll
    enabled: true
    state: started
  become: true